# Enums
enum AccountType { ASSET LIABILITY INCOME EXPENSE EQUITY }
enum OwnerType { USER_A USER_B SHARED }
enum EntryType { DEBIT CREDIT }
enum RecurrenceFrequency { SEMANAL MENSUAL ANUAL }

# Hogar (Tenant principal)
type Household @table {
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Usuario ligado a Auth UID
type User @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  email: String!
  displayName: String
  household: Household!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Cuenta contable (jerarquía de activos, pasivos, gastos, ingresos, capital)
type Account @table {
  name: String!
  type: AccountType!
  ownerType: OwnerType!
  household: Household!
  cutDay: Int
  paymentDay: Int
  systemKey: String
  creditLimit: Float @col(dataType: "numeric(14,2)")
  color: String
  isArchived: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Cabecera de transacción
type Journal @table {
  date: Timestamp!
  description: String!
  dueDate: Timestamp
  
  # Funcionalidades avanzadas
  isInternalTransfer: Boolean! @default(value: false)
  incomeCategoryType: String   # "Ordinario" o "Extraordinario"
  
  # Gestión de MSI
  isMsi: Boolean! @default(value: false)
  msiRefId: String             # Id para agrupar todas las cuotas del mismo MSI
  msiMonthNumber: Int          # Número de la cuota (1, 2, 3...)
  
  # Gestión de Recurrentes
  isRecurring: Boolean! @default(value: false)
  recurringFrequency: String   # Ej. "MENSUAL", "SEMANAL", "ANUAL"
  recurringEndDate: Timestamp  # Límite para gasto recurrente
  
  category: Category           # Relación opcional
  
  household: Household!
  createdAt: Timestamp! @default(expr: "request.time")
  
  # Nuevos campos opcionales Fase 0
  isReversed: Boolean! @default(value: false)
  reversalOf: Journal
  generatedFrom: RecurringTemplate
}

# Asiento atómico (debe/haber)
type Entry @table @index(fields: ["journalId"]) @index(fields: ["accountId", "journalId"]) {
  journal: Journal!
  account: Account!
  amount: Float! @col(dataType: "numeric(14,2)")
  prorataFactor: Float! @col(dataType: "numeric(14,6)")
  ownerUid: String!
  isShared: Boolean! @default(value: false)
  authDate: Timestamp
  entryType: EntryType! @default(value: DEBIT)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Vista para calcular el balance neto de un Journal
type JournalBalance @view(sql: """
  SELECT
    journal_id,
    SUM(amount) as net_balance
  FROM entry
  GROUP BY journal_id
""") {
  journal: Journal @unique
  netBalance: Float
}

# Vista para saldos de cuenta
type AccountBalance @view(sql: """
  SELECT
    account_id,
    COALESCE(SUM(amount), 0) as balance
  FROM entry
  GROUP BY account_id
""") {
  account: Account @unique
  balance: Float
}

# Presupuesto mensual por categoría (plantilla permanente)
type Budget @table @index(fields: ["householdId", "categoryName", "ownerType"]) @index(fields: ["householdId", "period"]) {
  categoryName: String!
  assignedAmount: Float! @col(dataType: "numeric(14,2)")
  household: Household!
  ownerType: OwnerType!  # Si es personal o compartido
  createdAt: Timestamp! @default(expr: "request.time")
  
  # Nuevos campos opcionales Fase 0
  period: Date
  category: Category
}

# Vista: Dinero sin asignar
type UnassignedCash @view(sql: """
  SELECT
    h.id as household_id,
    COALESCE(SUM(CASE WHEN a.type = 'INCOME' THEN e.amount ELSE 0 END), 0)
      - COALESCE(SUM(b.assigned_amount), 0) as unassigned
  FROM household h
  LEFT JOIN account a ON a.household_id = h.id
  LEFT JOIN entry e ON e.account_id = a.id
  LEFT JOIN budget b ON b.household_id = h.id
  GROUP BY h.id
""") {
  household: Household @unique
  unassigned: Float
}

# Tabla de liquidaciones para Reset
type Settlement @table {
  household: Household!
  ownerType: OwnerType!
  amount: Float! @col(dataType: "numeric(14,2)")
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# Proyecto de Ahorro (cuenta de capital, no presupuesto operativo)
type SavingsProject @table {
  name: String!
  targetAmount: Float!          @col(dataType: "numeric(14,2)")
  currentAmount: Float!         @default(value: 0.0) @col(dataType: "numeric(14,2)")
  priority: Int!                # Orden en la cascada (1 = primero)
  isCompleted: Boolean!         @default(value: false)
  monthlyQuota: Float           @col(dataType: "numeric(14,2)")
  targetAccount: String
  household: Household!
  createdAt: Timestamp!         @default(expr: "request.time")
  
  # Nuevo campo opcional Fase 0
  account: Account
}

# Activo externo/ilíquido (casa, auto, inversiones externas)
type ExternalAsset @table {
  name: String!
  estimatedValue: Float! @col(dataType: "numeric(14,2)")
  assetType: String!            # ej: "inmueble", "vehiculo", "inversion"
  household: Household!
  lastUpdated: Timestamp!       @default(expr: "request.time")
}

# Vista: Patrimonio Neto del Hogar
type NetWorthSnapshot @view(sql: """
  SELECT
    h.id as household_id,
    COALESCE(SUM(CASE WHEN a.type = 'ASSET' THEN e.amount ELSE 0 END), 0)
      + COALESCE((SELECT SUM(estimated_value) FROM external_asset ea WHERE ea.household_id = h.id), 0)
      - COALESCE(SUM(CASE WHEN a.type = 'LIABILITY' THEN e.amount ELSE 0 END), 0) as net_worth
  FROM household h
  LEFT JOIN account a ON a.household_id = h.id
  LEFT JOIN entry e ON e.account_id = a.id
  GROUP BY h.id
""") {
  household: Household @unique
  netWorth: Float
}

# Categoría personalizada para gastos/ingresos
type Category @table {
  name: String!
  type: AccountType!          # EXPENSE o INCOME
  color: String               # Opcional, para UI
  household: Household!
  ownerType: OwnerType!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Etiquetas para agrupaciones transversales
type Tag @table {
  name: String!
  household: Household!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Relación muchos-a-muchos entre Journal y Tag
type JournalTag @table(key: ["journal", "tag"]) {
  journal: Journal!
  tag: Tag!
}

# Tabla de Tipos de Cambio diarios (fuente: Banxico)
type ExchangeRate @table(key: ["currency", "date"]) {
  currency: String!   @col(dataType: "varchar(3)")  # ej. "USD", "EUR"
  rate: Float!        @col(dataType: "numeric(14,6)")
  date: Date!                                         # Fecha del tipo de cambio
  source: String!     @default(value: "BANXICO")
  createdAt: Timestamp! @default(expr: "request.time")
}

# -------------------------------------------------------------------------
# FASE 0: EXPANSIÓN SEGURA (Sólo campos y vistas aditivas)
# -------------------------------------------------------------------------

type RecurringTemplate @table {
  description: String!
  debitAccount: Account!
  creditAccount: Account!
  amount: Float! @col(dataType: "numeric(14,2)")
  category: Category
  ownerType: OwnerType!
  frequency: RecurrenceFrequency!
  startDate: Date!
  nextDate: Date!
  isActive: Boolean! @default(value: true)
  household: Household!
  createdAt: Timestamp! @default(expr: "request.time")
}

type JournalBalanceV2 @view(sql: """
  SELECT
    journal_id,
    SUM(CASE WHEN entry_type = 'DEBIT' THEN amount ELSE -amount END) as diff
  FROM entry
  GROUP BY journal_id
""") {
  journal: Journal @unique
  diff: Float
}

type AccountBalanceV2 @view(sql: """
  SELECT
    account_id,
    COALESCE(SUM(CASE WHEN entry_type = 'DEBIT' THEN amount ELSE -amount END), 0) as balance
  FROM entry
  GROUP BY account_id
""") {
  account: Account @unique
  balance: Float
}

type UnassignedCashV2 @view(sql: """
  SELECT
    h.id as household_id,
    COALESCE(inc.net_income, 0) - COALESCE(budg.total_budget, 0) as unassigned
  FROM household h
  LEFT JOIN (
    SELECT a.household_id,
           SUM(CASE WHEN e.entry_type = 'CREDIT' THEN e.amount ELSE -e.amount END) as net_income
    FROM account a
    JOIN entry e ON e.account_id = a.id
    WHERE a.type = 'INCOME'
    GROUP BY a.household_id
  ) inc ON inc.household_id = h.id
  LEFT JOIN (
    SELECT household_id, SUM(assigned_amount) as total_budget
    FROM budget
    GROUP BY household_id
  ) budg ON budg.household_id = h.id
""") {
  household: Household @unique
  unassigned: Float
}

type NetWorthSnapshotV2 @view(sql: """
  SELECT
    h.id as household_id,
    COALESCE(ass.total_asset, 0) + COALESCE(ext.total_ext, 0) - COALESCE(lia.total_liability, 0) as net_worth
  FROM household h
  LEFT JOIN (
    SELECT a.household_id, SUM(CASE WHEN e.entry_type = 'DEBIT' THEN e.amount ELSE -e.amount END) as total_asset
    FROM account a JOIN entry e ON e.account_id = a.id
    WHERE a.type = 'ASSET' GROUP BY a.household_id
  ) ass ON ass.household_id = h.id
  LEFT JOIN (
    SELECT a.household_id, SUM(CASE WHEN e.entry_type = 'CREDIT' THEN e.amount ELSE -e.amount END) as total_liability
    FROM account a JOIN entry e ON e.account_id = a.id
    WHERE a.type = 'LIABILITY' GROUP BY a.household_id
  ) lia ON lia.household_id = h.id
  LEFT JOIN (
    SELECT household_id, SUM(estimated_value) as total_ext
    FROM external_asset GROUP BY household_id
  ) ext ON ext.household_id = h.id
""") {
  household: Household @unique
  netWorth: Float
}

type SavingsProjectBalance @view(sql: """
  SELECT
    sp.id as savings_project_id,
    COALESCE(SUM(
      CASE
        WHEN a.type IN ('ASSET', 'EXPENSE') THEN
          CASE WHEN e.entry_type = 'DEBIT' THEN e.amount ELSE -e.amount END
        ELSE
          CASE WHEN e.entry_type = 'CREDIT' THEN e.amount ELSE -e.amount END
      END
    ), 0) as balance
  FROM savings_project sp
  LEFT JOIN account a ON a.id = sp.account_id
  LEFT JOIN entry e ON e.account_id = a.id
  GROUP BY sp.id
""") {
  savingsProject: SavingsProject @unique
  balance: Float
}
