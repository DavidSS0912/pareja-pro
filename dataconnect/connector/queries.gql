query GetJournalBalanceV2($journalId: UUID!, $householdId: UUID!) @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" }) @redact @check(expr: "this != null && this.household.id == vars.householdId", message: "El recurso no pertenece a este hogar") { household { id } }
  journalBalanceV2s(where: { 
    journalId: { eq: $journalId },
    journal: { householdId: { eq: $householdId } }
  }) {
    diff
  }
}

query NegativeEntries @auth(level: NO_ACCESS) {
  entries(where: { amount: { lt: 0 } }) {
    id
    amount
    entryType
    journal {
      id
      description
    }
  }
}

query UnbalancedJournals @auth(level: NO_ACCESS) {
  journalBalanceV2s(where: { diff: { ne: 0 } }) {
    journalId
    diff
  }
}
