query GetHouseholdNetBalances($householdId: UUID!) @auth(level: USER) {
  entries(where: { journal: { householdId: { eq: $householdId } }, account: { type: { in: [ASSET, LIABILITY] } } }) {
    ownerUid
    amount
    account {
      id
      type
    }
  }
}

query GetMonthBudgets($householdId: UUID!, $period: Date!) @auth(level: USER) {
  budgets(where: {
    householdId: { eq: $householdId },
    period: { eq: $period }
  }) {
    id
    categoryName
    assignedAmount
    period
    ownerType
  }
}

query GetUnassignedCash($householdId: UUID!) @auth(level: USER) {
  unassignedCashes(where: { householdId: { eq: $householdId } }) {
    unassigned
  }
}

query GetSavingsProjects($householdId: UUID!) @auth(level: USER) {
  savingsProjects(where: { householdId: { eq: $householdId } }, orderBy: { priority: ASC }) {
    id
    name
    targetAmount
    currentAmount
    priority
    isCompleted
  }
}

query GetExternalAssets($householdId: UUID!) @auth(level: USER) {
  externalAssets(where: { householdId: { eq: $householdId } }) {
    id
    name
    estimatedValue
    assetType
  }
}

query GetNetWorth($householdId: UUID!) @auth(level: USER) {
  netWorthSnapshots(where: { householdId: { eq: $householdId } }) {
    netWorth
  }
}
