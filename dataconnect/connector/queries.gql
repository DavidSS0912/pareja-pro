query GetLatestRate($currency: String!) @auth(level: USER) {
  exchangeRates(
    where: { currency: { eq: $currency } },
    orderBy: { date: DESC },
    limit: 1
  ) {
    rate
    date
  }
}

query GetExpensesByHousehold($householdId: UUID!) @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" })
    @redact
    @check(expr: "this != null && this.household.id == vars.householdId", message: "El recurso no pertenece a este hogar") {
    household { id }
  }
  entries(
    where: { 
      journal: { 
        householdId: { eq: $householdId },
      }, 
      account: { type: { eq: EXPENSE } } 
    },
    orderBy: { createdAt: DESC }
  ) {
    id
    amount
    entryType
    createdAt
    ownerUid
    isShared
    journal {
      id
      description
      date
      isInternalTransfer
      isMsi
      msiMonthNumber
      msiRefId
      isRecurring
      recurringFrequency
      categoryId
      category {
        name
        color
      }
      # Dataconnect no expande M2M fácilmente sin una subquery, pero podemos recuperar las JournalTag
    }
    account {
      name
    }
  }
}

