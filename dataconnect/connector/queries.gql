query GetHouseholdAccounts($householdId: UUID!) @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" })
    @redact
    @check(expr: "this != null && this.household.id == vars.householdId", message: "El recurso no pertenece a este hogar") {
    household { id }
  }
  accounts(where: { 
    householdId: { eq: $householdId },
  }) {
    id
    name
    type
    ownerType
    cutDay
    paymentDay
    systemKey
    creditLimit
    color
    isArchived
  }
}

query GetHouseholdNetBalances($householdId: UUID!) @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" })
    @redact
    @check(expr: "this != null && this.household.id == vars.householdId", message: "El recurso no pertenece a este hogar") {
    household { id }
  }
  entries(where: { 
    journal: { 
      householdId: { eq: $householdId },
    }, 
    account: { type: { in: [ASSET, LIABILITY] } } 
  }) {
    ownerUid
    amount
    entryType
    account {
      id
      type
    }
  }
}

query GetBudgets($householdId: UUID!) @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" })
    @redact
    @check(expr: "this != null && this.household.id == vars.householdId", message: "El recurso no pertenece a este hogar") {
    household { id }
  }
  budgets(where: {
    householdId: { eq: $householdId },
    household: {
      users_on_household: {
        exist: {
          uid: { eq_expr: "auth.uid" }
        }
      }
    }
  }) {
    id
    assignedAmount
    ownerType
    period
    categoryId
    category { id name }
  }
}

