mutation CreateJournalWithEntries(
  $householdId: UUID!,
  $date: Timestamp!,
  $description: String!,
  $amount: Float!,                 # SIEMPRE positivo
  $debitAccountId: UUID!,
  $creditAccountId: UUID!,
  $prorataFactor: Float!,
  $ownerUid: String!,
  $isShared: Boolean!,
  $isInternalTransfer: Boolean,
  $incomeCategoryType: String,
  $isMsi: Boolean,
  $msiRefId: String,
  $msiMonthNumber: Int,
  $isRecurring: Boolean,
  $recurringFrequency: String,
  $recurringEndDate: Timestamp,
  $categoryId: UUID = null
) @auth(level: USER) @transaction {

  # [VERIFICAR] Autorización: el usuario pertenece al hogar y las cuentas son de ese hogar
  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    debitAccount: account(id: $debitAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId && vars.amount > 0 && vars.debitAccountId != vars.creditAccountId",
             message: "Cuenta de débito inválida, monto no positivo o cuentas iguales") {
      household { id }
    }
    creditAccount: account(id: $creditAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Cuenta de crédito inválida") {
      household { id }
    }
    validCategory: categories(where: {
      id: { eq: $categoryId },
      householdId: { eq: $householdId }
    }) @check(expr: "vars.categoryId == null || this.size() == 1",
              message: "La categoría no pertenece a este hogar") {
      id
    }
  }

  journal_insert(data: {
    householdId: $householdId,
    date: $date,
    description: $description,
    isInternalTransfer: $isInternalTransfer,
    incomeCategoryType: $incomeCategoryType,
    isMsi: $isMsi,
    msiRefId: $msiRefId,
    msiMonthNumber: $msiMonthNumber,
    isRecurring: $isRecurring,
    recurringFrequency: $recurringFrequency,
    recurringEndDate: $recurringEndDate,
    categoryId: $categoryId
  })

  debitEntry: entry_insert(data: {
    journalId_expr: "response.journal_insert.id",
    accountId: $debitAccountId,
    amount: $amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: DEBIT
  })

  creditEntry: entry_insert(data: {
    journalId_expr: "response.journal_insert.id",
    accountId: $creditAccountId,
    amount: $amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: CREDIT
  })
}

mutation CreateSharedExpenseWithProration(
  $householdId: UUID!,
  $date: Timestamp!,
  $description: String!,
  $totalAmount: Float!,
  $prorataFactor: Float!,
  $payerAccountId: UUID!,
  $user1ExpenseAccountId: UUID!,
  $user2ExpenseAccountId: UUID!,
  $user1Amount: Float!,
  $user2Amount: Float!,
  $ownerUid: String!,
  $isShared: Boolean!,
  $isMsi: Boolean,
  $msiRefId: String,
  $msiMonthNumber: Int,
  $isRecurring: Boolean,
  $recurringFrequency: String,
  $recurringEndDate: Timestamp,
  $categoryId: UUID = null
) @auth(level: USER) @transaction {

  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    payerAccount: account(id: $payerAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId && vars.totalAmount > 0 && vars.user1Amount >= 0 && vars.user2Amount >= 0 && (vars.user1Amount + vars.user2Amount - vars.totalAmount) < 0.005 && (vars.user1Amount + vars.user2Amount - vars.totalAmount) > -0.005",
             message: "Cuenta de pago inválida o el reparto no suma el total") {
      household { id }
    }
    user1Account: account(id: $user1ExpenseAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Cuenta de gasto 1 inválida") {
      household { id }
    }
    user2Account: account(id: $user2ExpenseAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Cuenta de gasto 2 inválida") {
      household { id }
    }
    validCategory: categories(where: {
      id: { eq: $categoryId },
      householdId: { eq: $householdId }
    }) @check(expr: "vars.categoryId == null || this.size() == 1",
              message: "La categoría no pertenece a este hogar") {
      id
    }
  }

  journal_insert(data: {
    householdId: $householdId,
    date: $date,
    description: $description,
    isMsi: $isMsi,
    msiRefId: $msiRefId,
    msiMonthNumber: $msiMonthNumber,
    isRecurring: $isRecurring,
    recurringFrequency: $recurringFrequency,
    recurringEndDate: $recurringEndDate,
    categoryId: $categoryId
  })

  payerEntry: entry_insert(data: {
    journalId_expr: "response.journal_insert.id",
    accountId: $payerAccountId,
    amount: $totalAmount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: CREDIT
  })

  user1Entry: entry_insert(data: {
    journalId_expr: "response.journal_insert.id",
    accountId: $user1ExpenseAccountId,
    amount: $user1Amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: DEBIT
  })

  user2Entry: entry_insert(data: {
    journalId_expr: "response.journal_insert.id",
    accountId: $user2ExpenseAccountId,
    amount: $user2Amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: DEBIT
  })
}

mutation CreateBudget(
  $householdId: UUID!,
  $categoryId: UUID!,
  $ownerType: OwnerType!,
  $period: Date!,                  # día 1 del mes, formato YYYY-MM-01
  $assignedAmount: Float!
) @auth(level: USER) @transaction {

  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId && vars.assignedAmount >= 0",
             message: "Hogar inválido o monto negativo") {
      household { id }
    }
    category(id: $categoryId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Categoría inválida") {
      household { id }
    }
    # [VERIFICAR] Validar que period sea el día 1 del mes (YYYY-MM-01)
    periodCheck: user(key: { uid_expr: "auth.uid" })
      @check(expr: "string(vars.period).endsWith('-01') || string(vars.period).contains('-01T')",
             message: "El periodo del presupuesto debe ser el día 1 del mes") {
      uid
    }
    # Evita duplicados mientras no exista el índice único
    existing: budgets(where: {
      householdId: { eq: $householdId },
      categoryId: { eq: $categoryId },
      ownerType: { eq: $ownerType },
      period: { eq: $period }
    }) @check(expr: "this.size() == 0",
              message: "Ya existe un presupuesto para esa categoría, dueño y mes") {
      id
    }
  }

  budget_insert(data: {
    householdId: $householdId,
    categoryId: $categoryId,
    ownerType: $ownerType,
    period: $period,
    assignedAmount: $assignedAmount
  })
}

# Solo se cambia el monto: categoría, dueño y mes no se editan
