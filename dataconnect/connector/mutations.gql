mutation DeleteJournal(
  $journalId: UUID!,
  $householdId: UUID!
) @auth(level: USER) @transaction {
  
  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    journal(id: $journalId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El journal no pertenece a este hogar") {
      household { id }
    }
    reversals: journals(where: { reversalOfId: { eq: $journalId } })
      @check(expr: "this.size() == 0", message: "El journal tiene reversas asociadas") {
      id
    }
  }

  journalTag_deleteMany(where: { journalId: { eq: $journalId } })
  entry_deleteMany(where: { journalId: { eq: $journalId } })
  journal_delete(id: $journalId)
}

mutation UpdateJournalWithEntries(
  $journalId: UUID!,
  $householdId: UUID!,
  $date: Timestamp!,
  $description: String!,
  $amount: Float!,
  $debitAccountId: UUID!,
  $creditAccountId: UUID!,
  $prorataFactor: Float!,
  $ownerUid: String!,
  $isShared: Boolean!,
  $isInternalTransfer: Boolean,
  $incomeCategoryType: String,
  $categoryId: UUID = null
) @auth(level: USER) @transaction {

  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    journal(id: $journalId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El journal no pertenece a este hogar") {
      household { id }
    }
    debitAccount: account(id: $debitAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId && vars.amount > 0 && vars.debitAccountId != vars.creditAccountId",
             message: "Cuenta de débito inválida, monto no positivo o cuentas iguales") {
      household { id }
    }
    creditAccount: account(id: $creditAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Cuenta de crédito inválida") {
      household { id }
    }
    validCategory: categories(where: {
      id: { eq: $categoryId },
      householdId: { eq: $householdId }
    }) @check(expr: "vars.categoryId == null || this.size() == 1",
              message: "La categoría no pertenece a este hogar") {
      id
    }
  }

  journal_update(id: $journalId, data: {
    date: $date,
    description: $description,
    isInternalTransfer: $isInternalTransfer,
    incomeCategoryType: $incomeCategoryType,
    categoryId: $categoryId
  })

  entry_deleteMany(where: { journalId: { eq: $journalId } })

  debitEntry: entry_insert(data: {
    journalId: $journalId,
    accountId: $debitAccountId,
    amount: $amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: DEBIT
  })

  creditEntry: entry_insert(data: {
    journalId: $journalId,
    accountId: $creditAccountId,
    amount: $amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: CREDIT
  })
}

mutation UpdateSharedExpenseWithProration(
  $journalId: UUID!,
  $householdId: UUID!,
  $date: Timestamp!,
  $description: String!,
  $totalAmount: Float!,
  $prorataFactor: Float!,
  $payerAccountId: UUID!,
  $user1ExpenseAccountId: UUID!,
  $user2ExpenseAccountId: UUID!,
  $user1Amount: Float!,
  $user2Amount: Float!,
  $ownerUid: String!,
  $isShared: Boolean!,
  $isRecurring: Boolean,
  $recurringFrequency: String,
  $recurringEndDate: Timestamp,
  $categoryId: UUID = null
) @auth(level: USER) @transaction {

  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    journal(id: $journalId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El journal no pertenece a este hogar") {
      household { id }
    }
    payerAccount: account(id: $payerAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId && vars.totalAmount > 0 && vars.user1Amount >= 0 && vars.user2Amount >= 0 && (vars.user1Amount + vars.user2Amount - vars.totalAmount) < 0.005 && (vars.user1Amount + vars.user2Amount - vars.totalAmount) > -0.005",
             message: "Cuenta de pago inválida o el reparto no suma el total") {
      household { id }
    }
    user1Account: account(id: $user1ExpenseAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Cuenta de gasto 1 inválida") {
      household { id }
    }
    user2Account: account(id: $user2ExpenseAccountId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "Cuenta de gasto 2 inválida") {
      household { id }
    }
    validCategory: categories(where: {
      id: { eq: $categoryId },
      householdId: { eq: $householdId }
    }) @check(expr: "vars.categoryId == null || this.size() == 1",
              message: "La categoría no pertenece a este hogar") {
      id
    }
  }

  journal_update(id: $journalId, data: {
    date: $date,
    description: $description,
    isRecurring: $isRecurring,
    recurringFrequency: $recurringFrequency,
    recurringEndDate: $recurringEndDate,
    categoryId: $categoryId
  })

  entry_deleteMany(where: { journalId: { eq: $journalId } })

  payerEntry: entry_insert(data: {
    journalId: $journalId,
    accountId: $payerAccountId,
    amount: $totalAmount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: CREDIT
  })

  user1Entry: entry_insert(data: {
    journalId: $journalId,
    accountId: $user1ExpenseAccountId,
    amount: $user1Amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: DEBIT
  })

  user2Entry: entry_insert(data: {
    journalId: $journalId,
    accountId: $user2ExpenseAccountId,
    amount: $user2Amount,
    prorataFactor: $prorataFactor,
    ownerUid: $ownerUid,
    isShared: $isShared,
    entryType: DEBIT
  })
}

