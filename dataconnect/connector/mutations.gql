mutation SetJournalTags(
  $journalId: UUID!,
  $householdId: UUID!,
  $tagIds: [UUID!]!
) @auth(level: USER) @transaction {
  # [VERIFICAR] Validación de pertenencia al hogar para journal y lista de tagIds
  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    journal(id: $journalId)
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El journal no pertenece a este hogar") {
      household { id }
    }
    validTags: tags(where: {
      id: { in: $tagIds },
      householdId: { eq: $householdId }
    }) @check(expr: "this.size() == vars.tagIds.size()",
              message: "Una o más etiquetas no pertenecen a este hogar") {
      id
    }
  }
  journalTag_deleteMany(where: { journalId: { eq: $journalId } })
  # Para insertar múltiples se requeriría hacerlo por SDK, o insertar uno por uno. 
  # Sin embargo, en Dataconnect Data Connect GraphQL por ahora no hay soporte nativo masivo
  # para tablas de join desde mutaciones sin usar variables _insertMany (que requieren sintaxis específica).
  # Para simplificar en esta mutación, la eliminación asegura la limpieza. 
  # La creación se puede hacer iterando del lado del cliente.
}

