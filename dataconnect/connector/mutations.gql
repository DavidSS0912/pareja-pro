mutation ReassignEntries(
  $householdId: UUID!,
  $fromAccountId: UUID!,
  $toAccountId: UUID!,
  $accountType: AccountType!
) @auth(level: USER) @transaction {
  query @redact {
    user(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null && this.household.id == vars.householdId",
             message: "El usuario no pertenece a este hogar") {
      household { id }
    }
    fromAccounts: accounts(where: {
      id: { eq: $fromAccountId },
      householdId: { eq: $householdId },
      type: { eq: $accountType }
    }) @check(expr: "this.size() == 1 && vars.fromAccountId != vars.toAccountId",
              message: "Cuenta de origen inválida, de distinto tipo o igual a la de destino") {
      id
    }
    toAccounts: accounts(where: {
      id: { eq: $toAccountId },
      householdId: { eq: $householdId },
      type: { eq: $accountType }
    }) @check(expr: "this.size() == 1",
              message: "Cuenta de destino inválida o de distinto tipo") {
      id
    }
  }
  entry_updateMany(
    where: { accountId: { eq: $fromAccountId } },
    data: { accountId: $toAccountId }
  )
}

